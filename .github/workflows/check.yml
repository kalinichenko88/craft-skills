name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Not ubuntu-latest, which moves under the workflow. 26.04 ships
    # ShellCheck 0.11.0, the version make check runs locally.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      # make check on macOS runs BWK awk, and the runner's awk can be gawk. CI
      # takes mawk, the default awk on Debian and Ubuntu, and the one the
      # scripts broke on.
      - run: |
          sudo update-alternatives --set awk /usr/bin/mawk
          awk -W version 2>&1 | head -n 1
          shellcheck --version | sed -n 2p
      - run: make check

  # The text eval of each scenario row whose files the pull request changes
  # (ADR 0007): about $0.20 a row, on the subscription of the token. A pull
  # request from a fork gets no secret, so it skips the job.
  scenarios-text:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The eval reads the base from origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run the text eval on the changed rows; a LOST item fails the job
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          tests/scenarios_text_eval.sh --changed | tee "$RUNNER_TEMP/eval.txt"
          if grep -q '^LOST' "$RUNNER_TEMP/eval.txt"; then exit 1; fi

  secrets:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
